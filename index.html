<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정산 승률 대시보드</title>
<style>
  :root {
    --bg:#0f1115; --card:#171a21; --card-2:#1d212a; --border:#262a33; --text:#eceef1;
    --dim:#9aa1ad; --faint:#6b7280; --accent:#4f8cff; --accent-dim:rgba(79,140,255,.14);
    --win:#34d399; --lose:#f87171;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding:32px 16px;
  }
  .wrap { max-width:860px; margin:0 auto; }
  header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  h1 { font-size:20px; margin:0; }
  .meta { color:var(--dim); font-size:12.5px; }
  .install-link { color:var(--accent); font-size:12.5px; text-decoration:none; }
  .install-link:hover { text-decoration:underline; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:18px; }
  .section-title { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; margin:28px 0 10px; }
  .count-badge { background:var(--accent-dim); color:var(--accent); font-weight:600; font-size:10.5px; border-radius:999px; padding:2px 9px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    text-align:left; font-size:10.5px; font-weight:600; color:var(--faint); text-transform:uppercase;
    letter-spacing:.03em; padding:9px 12px; border-bottom:1px solid var(--border);
  }
  td { padding:8px 12px; border-bottom:1px solid var(--border); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:nth-child(odd) { background:rgba(255,255,255,.015); }
  tbody tr:hover { background:rgba(79,140,255,.06); }
  .rank { display:inline-flex; width:18px; color:var(--faint); font-size:11px; font-weight:600; }
  .rank.r1 { color:#ffd166; } .rank.r2 { color:#cfd8e3; } .rank.r3 { color:#e0a675; }
  .name { font-weight:600; }
  .pill {
    display:inline-block; font-size:11px; font-weight:600; padding:2px 7px; border-radius:999px;
    background:rgba(255,255,255,.06); color:var(--dim); white-space:nowrap;
  }
  .rate { font-weight:700; }
  .rate.high { color:var(--win); }
  .rate.low { color:var(--dim); }
  .money { text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
  .profit { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
  .profit.pos { color:var(--win); } .profit.neg { color:var(--lose); }
  .picks { display:flex; flex-wrap:wrap; gap:3px; max-width:220px; }
  .pick-chip {
    display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:999px;
    background:var(--accent-dim); color:var(--accent); border:1px solid rgba(79,140,255,.3);
    white-space:nowrap; text-decoration:none;
  }
  .pick-chip:hover { filter:brightness(1.15); }
  .muted { color:var(--faint); font-size:12px; }
  details.sport { margin-top:4px; }
  details.sport > summary {
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; padding:10px 14px;
    border-radius:10px; background:var(--card); border:1px solid var(--border); font-weight:700; font-size:13px;
  }
  details.sport > summary::-webkit-details-marker { display:none; }
  details.sport > summary:before { content:'▸'; color:var(--faint); font-size:10px; }
  details.sport[open] > summary:before { content:'▾'; }
  .sport-card { margin-top:6px; }
  .sport-header { padding:8px 12px 2px; font-size:11.5px; color:var(--dim); font-weight:700; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--dim); }
  .empty-state .btn {
    display:inline-block; margin-top:14px; background:var(--accent); color:#fff; text-decoration:none;
    padding:9px 16px; border-radius:999px; font-weight:600; font-size:13px;
  }
  .match-card {
    display:block; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; text-decoration:none; color:var(--text);
  }
  .match-card:hover { border-color:var(--accent); }
  .match-title { font-size:11.5px; color:var(--dim); margin-bottom:8px; }
  .match-sides { display:flex; align-items:center; gap:10px; }
  .match-side { flex:1; }
  .match-side .team { font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .match-side .bar-track { height:6px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; margin-bottom:4px; }
  .match-side .bar-fill { height:100%; background:var(--accent); border-radius:999px; }
  .match-side .stat { font-size:11px; color:var(--faint); }
  .match-vs { color:var(--faint); font-size:11px; font-weight:700; }
  .search-box { position:relative; margin:14px 0 20px; }
  .search-box input {
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 14px; font-size:14px; outline:none;
  }
  .search-box input:focus { border-color:var(--accent); }
  .search-box .hint { margin-top:6px; font-size:11.5px; color:var(--faint); }
  tr.jsa-hide { display:none; }
  tr.jsa-match td:first-child { position:relative; }
  tr.jsa-match { background:var(--accent-dim) !important; }
  #jsa-lock {
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    z-index:999; flex-direction:column; gap:14px;
  }
  #jsa-lock .box { text-align:center; }
  #jsa-lock input {
    background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:10px;
    padding:10px 14px; font-size:16px; letter-spacing:4px; text-align:center; width:140px; outline:none;
  }
  #jsa-lock input:focus { border-color:var(--accent); }
  #jsa-lock .err { color:var(--lose); font-size:12.5px; min-height:16px; }
</style>
</head>
<body>
  <div id="jsa-lock">
    <div class="box">
      <div style="font-size:14px; color:var(--dim); margin-bottom:10px;">🔒 비밀번호를 입력하세요</div>
      <input id="jsa-pw" type="password" inputmode="numeric" maxlength="8" autofocus>
      <div class="err" id="jsa-pw-err"></div>
    </div>
  </div>
  <div class="wrap" id="jsa-wrap" style="display:none;">
    <header>
      <h1>📊 정산 승률 대시보드</h1>
      <a class="install-link" href="https://raw.githubusercontent.com/srleeinkorea/rota-status/main/fmkorea_jungsan_analyzer.user.js">유저스크립트 설치</a>
    </header>
    <div class="meta" id="meta">불러오는 중...</div>
    <div class="search-box">
      <input id="jsa-search" type="text" placeholder="🔍 닉네임으로 찾기 (예: 손나은)" autocomplete="off">
      <div class="hint" id="jsa-search-hint"></div>
    </div>
    <div id="content"></div>
  </div>

<script>
(function () {
  const SITE_PW = '0000';
  const lockEl = document.getElementById('jsa-lock');
  const wrapEl = document.getElementById('jsa-wrap');
  const input = document.getElementById('jsa-pw');
  const errEl = document.getElementById('jsa-pw-err');

  function unlock() {
    lockEl.style.display = 'none';
    wrapEl.style.display = '';
    try { sessionStorage.setItem('jsa-unlocked', '1'); } catch (e) {}
  }

  let already = false;
  try { already = sessionStorage.getItem('jsa-unlocked') === '1'; } catch (e) {}
  if (already) {
    unlock();
  } else {
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (input.value === SITE_PW) {
        unlock();
      } else {
        errEl.textContent = '비밀번호가 올바르지 않습니다.';
        input.value = '';
      }
    });
  }
})();
</script>
<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtPct(n) { return Math.round(n) + '%'; }
function numFmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch (e) { return iso; }
}

function picksHtml(picks) {
  if (!picks || picks.length === 0) return '<span class="muted">—</span>';
  const shown = picks.slice(0, 6);
  let html = '<div class="picks">';
  html += shown.map((p) => {
    const label = escapeHtml(p.team) + (p.bet ? `(${numFmt(p.bet)})` : '');
    if (p.url) return `<a class="pick-chip" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    return `<span class="pick-chip">${label}</span>`;
  }).join('');
  if (picks.length > 6) html += `<span class="muted">+${picks.length - 6}</span>`;
  html += '</div>';
  return html;
}

function rowHtml(r, withMoney, rankIdx) {
  const medal = ['r1','r2','r3'][rankIdx] || '';
  const rateClass = r.rate >= 70 ? 'high' : 'low';
  let html = `<tr data-jsa-name="${escapeHtml(r.name.toLowerCase())}"><td><span class="rank ${medal}">${rankIdx + 1}</span></td><td class="name">${escapeHtml(r.name)}</td><td><span class="pill">${r.win}승${r.lose}패</span></td><td class="rate ${rateClass}">${fmtPct(r.rate)}</td>`;
  if (withMoney) {
    const profitClass = r.profit >= 0 ? 'pos' : 'neg';
    html += `<td class="money">${numFmt(r.totalBet)}</td><td class="profit ${profitClass}">${r.profit >= 0 ? '+' : ''}${numFmt(r.profit)}</td><td>${picksHtml(r.picks)}</td>`;
  }
  html += '</tr>';
  return html;
}

function matchCardHtml(m) {
  const totalA = m.betA || 0, totalB = m.betB || 0;
  const sum = totalA + totalB;
  const pctA = sum > 0 ? Math.round((totalA / sum) * 100) : 50;
  const pctB = 100 - pctA;
  return `<a class="match-card" href="${escapeHtml(m.url)}" target="_blank" rel="noopener noreferrer">
    <div class="match-title">${escapeHtml(m.title)}</div>
    <div class="match-sides">
      <div class="match-side">
        <div class="team">${escapeHtml(m.teamA)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pctA}%;"></div></div>
        <div class="stat">${m.countA || 0}명 · ${numFmt(totalA)}P (${pctA}%)</div>
      </div>
      <div class="match-vs">VS</div>
      <div class="match-side">
        <div class="team">${escapeHtml(m.teamB)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pctB}%;"></div></div>
        <div class="stat">${m.countB || 0}명 · ${numFmt(totalB)}P (${pctB}%)</div>
      </div>
    </div>
  </a>`;
}

function render(data) {
  const metaEl = document.getElementById('meta');
  const contentEl = document.getElementById('content');
  metaEl.textContent = `${fmtDate(data.generatedAt)} 기준 · ${data.windowLabel || ''} · 최소 ${data.minPicks}건 · 참여자 ${data.totalParticipants}명`;

  let html = '';
  const matches = data.ongoingMatches || [];
  if (matches.length) {
    html += `<div class="section-title">🔴 진행중인 경기 <span class="count-badge">${matches.length}건</span></div>`;
    matches.forEach((m) => { html += matchCardHtml(m); });
  }

  html += `<div class="section-title">🏆 종합 승률 랭킹 <span class="count-badge">${data.overall.length}명</span></div>`;
  if (!data.overall || data.overall.length === 0) {
    html += `<div class="muted">데이터가 없습니다.</div>`;
  } else {
    html += '<div class="card"><table><thead><tr><th></th><th>닉네임</th><th>전적</th><th>승률</th><th style="text-align:right;">베팅액</th><th style="text-align:right;">수익</th><th>진행중인 베팅</th></tr></thead><tbody>';
    data.overall.forEach((r, idx) => { html += rowHtml(r, true, idx); });
    html += '</tbody></table></div>';
  }

  const sportNames = Object.keys(data.sports || {});
  if (sportNames.length) {
    html += `<details class="sport"><summary>⚽ 종목별 랭킹 <span class="count-badge">${sportNames.length}개 종목</span></summary><div class="sport-card">`;
    for (const sport of sportNames) {
      const arr = data.sports[sport];
      html += `<div class="sport-header">${escapeHtml(sport)} <span class="count-badge">${arr.length}명</span></div>`;
      html += '<div class="card"><table><thead><tr><th></th><th>닉네임</th><th>전적</th><th>승률</th></tr></thead><tbody>';
      arr.forEach((r, idx) => { html += rowHtml(r, false, idx); });
      html += '</tbody></table></div>';
    }
    html += '</div></details>';
  }

  contentEl.innerHTML = html;
  applySearchFilter();
}

// 닉네임 검색: 입력된 글자가 들어간 닉네임 행만 남기고 나머지는 숨긴다.
// (업로드된 상위 랭킹 데이터 안에서만 찾을 수 있다 — 전체 게시판 검색이 아님)
function applySearchFilter() {
  const input = document.getElementById('jsa-search');
  const hint = document.getElementById('jsa-search-hint');
  if (!input) return;
  const q = input.value.trim().toLowerCase();
  const rows = document.querySelectorAll('#content tr[data-jsa-name]');
  if (!q) {
    rows.forEach((tr) => { tr.classList.remove('jsa-hide', 'jsa-match'); });
    document.querySelectorAll('#content details.sport').forEach((d) => { d.open = false; });
    hint.textContent = '';
    return;
  }
  let matchCount = 0;
  const sportsWithMatch = new Set();
  rows.forEach((tr) => {
    const name = tr.getAttribute('data-jsa-name') || '';
    if (name.includes(q)) {
      tr.classList.remove('jsa-hide');
      tr.classList.add('jsa-match');
      matchCount++;
      const sportDetails = tr.closest('details.sport');
      if (sportDetails) sportsWithMatch.add(sportDetails);
    } else {
      tr.classList.add('jsa-hide');
      tr.classList.remove('jsa-match');
    }
  });
  sportsWithMatch.forEach((d) => { d.open = true; });
  hint.textContent = matchCount > 0
    ? `${matchCount}건 일치 (업로드된 상위 랭킹 안에서만 검색됩니다)`
    : '일치하는 닉네임이 없습니다 (업로드된 상위 랭킹 밖일 수 있어요)';
}

function renderEmpty() {
  document.getElementById('meta').textContent = '';
  const searchBox = document.querySelector('.search-box');
  if (searchBox) searchBox.style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div class="empty-state">
      <div>아직 업로드된 분석 결과가 없습니다.</div>
      <div class="muted" style="margin-top:6px;">유저스크립트를 설치하고 해당 사이트에서 분석을 한 번 돌리면, 완료 시 자동으로 이 페이지에 반영됩니다.</div>
      <a class="btn" href="https://raw.githubusercontent.com/srleeinkorea/rota-status/main/fmkorea_jungsan_analyzer.user.js">유저스크립트 설치하기</a>
    </div>`;
}

document.getElementById('jsa-search').addEventListener('input', applySearchFilter);

fetch('./data.json', { cache: 'no-store' })
  .then((res) => { if (!res.ok) throw new Error('no data'); return res.json(); })
  .then(render)
  .catch(renderEmpty);
</script>
</body>
</html>
