<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에펨코리아 정산 승률 분석기</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --border:#262a33; --text:#eceef1; --dim:#9aa1ad; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding:24px;
  }
  .card {
    max-width:560px; width:100%; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:32px; box-shadow:0 12px 40px rgba(0,0,0,.4);
  }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--dim); line-height:1.6; font-size:14px; }
  a.btn {
    display:inline-block; margin-top:16px; background:var(--accent); color:#fff; text-decoration:none;
    padding:10px 18px; border-radius:999px; font-weight:600; font-size:14px;
  }
  a.btn:hover { filter:brightness(1.1); }
  code {
    display:block; margin-top:16px; background:#0c0e12; border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; font-size:12px; color:var(--dim); word-break:break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>📊 에펨코리아 정산 승률 분석기</h1>
    <p>잉여력놀이터 '정산' 게시판 글들을 자동으로 읽어서 참가자별 승률(종합/종목별)을 집계해주는 Tampermonkey 유저스크립트입니다. 아래 버튼을 누르면 Tampermonkey 설치 화면으로 이동합니다.</p>
    <a class="btn" href="https://raw.githubusercontent.com/srleeinkorea/rota-status/main/fmkorea_jungsan_analyzer.user.js">유저스크립트 설치하기</a>
    <p style="margin-top:20px;">설치 후에는 새 버전이 올라올 때마다 Tampermonkey가 자동으로 업데이트를 감지합니다.</p>
    <code>https://raw.githubusercontent.com/srleeinkorea/rota-status/main/fmkorea_jungsan_analyzer.user.js</code>
  </div>
</body>
</html>
